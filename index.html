<style>
:root{--paper:#ffffff;--ink:#17252a;--muted:#718184;--mint:#ffffff;--line:#c9d3d0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'DM Mono','Noto Sans KR',sans-serif}button,a{font:inherit}header{height:74px;display:flex;align-items:center;justify-content:center;padding:0 4vw;position:relative;border:0}.brand{color:inherit;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.04em;position:absolute;left:4vw;top:27px}.brand small{display:none}nav{display:flex;gap:38px;align-items:center}nav a{display:block;text-decoration:none;color:#777;padding:10px 0;border:0;font-size:12px;letter-spacing:.09em}nav a.active{background:transparent;color:#111;border:0;font-weight:600}.page{display:none}.page.active{display:block}.heading{padding:34px 4vw 24px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.15em}.heading h1{font-size:clamp(36px,6vw,80px);font-weight:400;letter-spacing:-.085em;margin:8px 0 0;line-height:1}.heading p{font-size:11px;color:var(--muted);margin:0 0 5px}.map-layout{position:relative;border:0;height:calc(100dvh - 74px);min-height:480px;overflow:hidden}#map{height:100%;width:100%;background:#ffffff;position:relative}.detail{position:absolute;right:24px;bottom:24px;width:min(340px,calc(100% - 48px));max-height:calc(100% - 48px);overflow:auto;z-index:850;background:var(--paper);border:0;padding:20px;display:none;flex-direction:column;gap:14px;box-shadow:0 8px 35px rgba(0,0,0,.12)}.detail.open{display:flex}.detail-close{position:absolute;top:14px;right:14px;border:0;background:transparent;cursor:pointer;font-size:22px;color:var(--ink)}.detail-top{font-size:11px;display:flex;justify-content:space-between;color:var(--muted)}.photo{aspect-ratio:4/3;background:var(--mint);display:grid;place-items:center;border:1px solid var(--line);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo .placeholder{font-size:12px;color:var(--muted);text-align:center;line-height:2}.detail h2{font-size:26px;font-weight:400;letter-spacing:-.06em;margin:0}.detail p{font-size:12px;line-height:2;color:#526365;margin:0}.meta{margin-top:auto;border-top:1px solid var(--line);padding-top:15px;font-size:11px;line-height:2.2;color:var(--muted)}.object-pin{width:31px;height:31px;background:#f8f5eb;border:2px solid #15191b;color:#15191b;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:500;box-shadow:2px 2px 0 #15191b;transition:transform .2s}.object-pin.selected{background:#b7e5d8;transform:scale(1.18)}.map-svg{width:100%;height:100%;display:block;touch-action:none}.map-land{fill:#101112;stroke:none}.map-pin{cursor:pointer}.map-pin circle{fill:#f8f5eb;stroke:#101112;stroke-width:1.8;vector-effect:non-scaling-stroke}.map-pin text{font-size:11px;fill:#101112;text-anchor:middle;dominant-baseline:central;pointer-events:none}.map-pin.selected circle{fill:#a7e2d4}.map-controls{position:absolute;left:18px;bottom:18px;z-index:2;display:flex;gap:5px}.map-controls button{background:#f8f5eb;border:1px solid #101112;width:34px;height:34px;cursor:pointer;font-size:19px}.map-credit{position:absolute;left:18px;top:18px;font-size:10px;letter-spacing:.1em;color:#161616}.popup-nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}.popup-nav button{border:1px solid var(--ink);background:transparent;cursor:pointer;width:38px;height:32px;font-size:20px}.popup-nav span{font-size:11px;color:var(--muted)}.timeline{border:0;padding:30px 4vw 90px}.year{display:grid;grid-template-columns:140px 1fr;border:0;padding:35px 0}.year-label{font-size:28px;letter-spacing:-.07em}.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.entry{cursor:pointer;border:0;background:transparent;text-align:left;padding:0;color:inherit}.entry .photo{transition:filter .2s}.entry:hover .photo{filter:brightness(.94)}.entry-index{font-size:10px;color:var(--muted);margin:12px 0 8px}.entry-title{font-size:16px;letter-spacing:-.05em}.entry-location{font-size:10px;color:var(--muted);margin-top:7px}footer{display:none}@media(max-width:850px){.map-layout{height:calc(100dvh - 74px);min-height:480px}.detail{right:12px;bottom:12px;width:min(310px,calc(100% - 24px))}.year{grid-template-columns:1fr;gap:22px}.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){header{padding:0 5vw}.brand{left:5vw;font-size:10px}nav{gap:18px}nav a{font-size:11px}.brand{font-size:12px}.heading{padding:28px 5vw 22px}.heading p{display:none}nav a{padding:9px 11px}.timeline{padding:0 5vw 60px}.entries{gap:15px}.entry-title{font-size:13px}footer{padding:20px 5vw}}

/* Minimal layout and editorial horizontal timeline */
html,body,main,.page{background:#fff!important}header{border:0!important;box-shadow:none!important}#map{background:#fff!important}.map-layout{border:0!important}.map-credit{display:none}.photo{border:0;background:#f4f4f4}.detail .meta{border:0}.popup-nav{border-color:#eee}.timeline{padding:40px 0 80px!important;border:0!important;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}.timeline-track{position:relative;display:flex;align-items:stretch;width:max-content;min-width:100%;padding:50px max(6vw,45px) 55px;gap:18px}.timeline-track:before{content:"";position:absolute;top:390px;left:0;right:0;height:1px;background:#222}.timeline-entry{position:relative;width:clamp(130px,13vw,205px);height:550px;flex:none;background:none;border:0;color:#111;text-align:left;padding:0;cursor:pointer}.timeline-entry .tl-figure{height:250px;display:flex;align-items:end;justify-content:center}.timeline-entry .photo{width:100%;height:var(--photo-height);aspect-ratio:auto;filter:grayscale(1);background:#f1f1f1}.timeline-entry .photo img{filter:grayscale(1)}.timeline-entry .photo .placeholder{font-size:10px;padding:10px}.tl-number{position:absolute;top:10px;left:0;font-size:10px;color:#777}.tl-date{height:44px;display:flex;align-items:center;justify-content:center;font-size:11px;white-space:nowrap}.tl-stem{height:45px;width:1px;background:#777;margin:auto}.tl-dot{position:relative;z-index:1;width:10px;height:10px;border-radius:50%;background:#111;margin:0 auto}.timeline-entry:hover .tl-dot{background:#86aaa4;transform:scale(1.4)}.tl-caption{padding:24px 5px 0;font-size:13px;line-height:1.5}.tl-caption small{display:block;font-size:10px;color:#777;margin-top:10px;line-height:1.6}.timeline-intro{padding:0 6vw;font-size:11px;letter-spacing:.09em;color:#777}.timeline-entry:nth-child(3n+2) .tl-figure{padding-bottom:15px}.timeline-entry:nth-child(3n+3) .tl-figure{padding-bottom:32px}@media(max-width:700px){header{justify-content:flex-end}.brand{font-size:10px;left:16px}nav{gap:17px}.timeline-track{padding-left:24px;padding-right:24px}.timeline-entry{width:155px}.timeline-intro{padding:0 24px}}
.detail{gap:10px!important}.popup-info{font-size:11px;line-height:1.9;color:#555}.popup-title{font-size:12px;font-weight:500;color:#111}.detail .photo{margin-bottom:3px}.popup-nav{margin-top:8px}
.detail{position:absolute}.popup-actions{display:flex;justify-content:flex-end;gap:12px;height:22px;align-items:center}.popup-actions button{position:static!important;background:transparent;border:0;color:#111;cursor:pointer;font-size:21px;line-height:1;padding:0 2px}.popup-title-row{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:7px;text-align:center}.popup-title-row button{border:0;background:transparent;font-size:19px;cursor:pointer;color:#111;padding:4px}.popup-title-row .popup-title{font-size:12px}.popup-info{text-align:center}.detail.expanded{width:min(620px,calc(100% - 32px));max-height:calc(100% - 32px);right:16px;bottom:16px;padding:25px}.detail.expanded .photo{aspect-ratio:4/3}.detail.expanded .photo img{object-fit:contain}.detail.expanded .popup-title-row{margin-top:8px}@media(max-width:520px){.detail.expanded{right:8px;bottom:8px;width:calc(100% - 16px);padding:18px}}
.detail.open{width:min(620px,calc(100% - 32px));right:16px;bottom:16px;padding:25px;max-height:calc(100% - 32px)}.detail.open .photo{aspect-ratio:4/3}.detail.open .photo img{object-fit:contain}.detail.open.expanded{position:fixed!important;z-index:9999!important;top:50%!important;left:50%!important;right:auto!important;bottom:auto!important;transform:translate(-50%,-50%);width:min(900px,calc(100vw - 48px));max-height:calc(100dvh - 48px);padding:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55),0 16px 60px rgba(0,0,0,.2)}.detail.open.expanded .photo{aspect-ratio:auto;height:min(65dvh,650px);min-height:180px}.detail.open.expanded .photo img{width:100%;height:100%;object-fit:contain}.detail.open.expanded .popup-info{font-size:11px}@media(max-width:520px){.detail.open{width:calc(100% - 16px);right:8px;bottom:8px;padding:18px}.detail.open.expanded{width:calc(100vw - 24px);padding:14px}}
.detail.open{overflow:visible}.detail.open .photo{overflow:hidden}.popup-title-row{display:block;text-align:center}.popup-side{position:absolute;top:50%;transform:translateY(-50%);z-index:10;border:0;background:rgba(255,255,255,.94);color:#111;width:45px;height:76px;font-size:26px;cursor:pointer;opacity:0;transition:opacity .2s,background .2s;display:grid;place-items:center}.popup-side-prev{left:0}.popup-side-next{right:0}.detail.open:hover .popup-side,.popup-side:focus-visible{opacity:1}.popup-side:hover{background:#fff}.detail.open.expanded .popup-side{width:60px;height:100px}@media(hover:none){.popup-side{opacity:.85;width:35px;height:60px}}@media(max-width:520px){.popup-side{width:35px;height:64px}}
.detail.open .popup-side{top:0!important;bottom:0!important;transform:none!important;height:100%!important;width:22%!important;max-width:none!important;min-width:58px!important;background:rgba(255,255,255,0)!important;opacity:0!important;display:flex;align-items:center;justify-content:center;transition:background .2s ease,opacity .2s ease!important}.detail.open .popup-side-prev{left:0!important}.detail.open .popup-side-next{right:0!important}.detail.open:hover .popup-side{opacity:0!important}.detail.open .popup-side:hover,.detail.open .popup-side:focus-visible{opacity:1!important;background:rgba(255,255,255,.62)!important}.detail.open.expanded .popup-side{height:100%!important;width:18%!important}@media(hover:none){.detail.open .popup-side{opacity:.7!important;background:rgba(255,255,255,.24)!important}.detail.open .popup-side:active{background:rgba(255,255,255,.65)!important}}
.detail.open .popup-side{width:11%!important;min-width:28px!important;z-index:2!important}.detail.open.expanded .popup-side{width:9%!important;min-width:28px!important}.detail.open .popup-actions{position:relative!important;z-index:30!important;display:flex!important;justify-content:flex-end!important;flex-shrink:0!important;pointer-events:auto!important}.detail.open .popup-actions button{position:relative!important;z-index:31!important;pointer-events:auto!important;cursor:pointer!important}.detail.open .popup-side:hover,.detail.open .popup-side:focus-visible{background:rgba(255,255,255,.62)!important}

/* Fit the popup to each photo's natural aspect ratio. */
.detail.open,.detail.open.expanded{box-sizing:border-box}
.detail.open .photo,.detail.open.expanded .photo{aspect-ratio:auto!important;width:100%;height:var(--popup-image-height,240px)!important;min-height:0!important;flex:none;margin-bottom:0;background:transparent}
.detail.open .photo img,.detail.open.expanded .photo img{display:block;width:100%;height:100%;object-fit:contain}
.detail.open .popup-title-row,.detail.open .popup-info{flex:none;overflow-wrap:anywhere}
</style></head><body>
<header><a class="brand" href="./" aria-label="홈 - 지도">THINGS OUT OF PLACE<small>제자리에 없는 것들 · AN ARCHIVE OF FOUND OBJECTS</small></a><nav><a href="./" data-page="map">MAP</a><a href="#timeline" data-page="timeline">TIMELINE</a></nav></header>
<main><section id="map-page" class="page"><div class="map-layout"><div id="map" aria-label="발견된 사물의 위치 지도"></div><aside class="detail" id="detail"></aside></div></section>
<section id="timeline-page" class="page"><div class="timeline" id="timeline"></div></section></main>
<footer><span>THINGS OUT OF PLACE © 2026</span><span>AN ONGOING ARCHIVE</span></footer>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script>
// 실제 기록으로 교체할 데이터. image에 사진 URL을 넣으면 두 화면에 동시에 표시됩니다.
// 좌표와 연도는 시연용 예시이며 실제 발견 위치/시점이 아닙니다.
let objects=[];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photo=o=>'<div class="photo">'+(o.image?'<img src="'+escapeHtml(o.image)+'" alt="'+escapeHtml(o.title)+'" loading="lazy">':'<div class="placeholder">IMAGE PENDING<br>사진을 추가할 수 있습니다</div>')+'</div>';
let svg,projection,zoomBehavior,viewport,selectedIndex=-1;
const mapWidth=1200,mapHeight=620;
function focusObject(o,animate=true){if(!Number.isFinite(o.lat)||!Number.isFinite(o.lng))return;const point=projection([o.lng,o.lat]);if(!point)return;const scale=3.1;const x=mapWidth*.47-point[0]*scale,y=mapHeight*.48-point[1]*scale;const transform=d3.zoomIdentity.translate(x,y).scale(scale);const target=animate?svg.transition().duration(950):svg;target.call(zoomBehavior.transform,transform)}

function fitPopupToPhoto(){
 const detail=document.getElementById('detail'),img=detail.querySelector('.photo img');
 if(!detail.classList.contains('open')||!img||!img.naturalWidth)return;
 const expanded=detail.classList.contains('expanded'),mobile=window.innerWidth<=520;
 const style=getComputedStyle(detail),px=parseFloat(style.paddingLeft)+parseFloat(style.paddingRight),py=parseFloat(style.paddingTop)+parseFloat(style.paddingBottom),gap=parseFloat(style.rowGap)||0;
 const layout=document.querySelector('.map-layout');
 const maxWidth=expanded?Math.min(900,window.innerWidth-(mobile?24:48)):Math.min(620,layout.clientWidth-(mobile?16:32));
 if(!expanded)detail.style.bottom=Math.max(mobile?8:16,layout.clientHeight-(window.innerHeight-layout.getBoundingClientRect().top)+(mobile?8:16))+'px';
 const maxHeight=expanded?window.innerHeight-48:Math.min(layout.clientHeight,window.innerHeight-layout.getBoundingClientRect().top)-(mobile?16:32);
 const ratio=img.naturalWidth/img.naturalHeight,others=[...detail.children].filter(el=>!el.classList.contains('photo')&&!el.classList.contains('popup-side'));
 const minWidth=Math.min(maxWidth,200+px);
 let width=maxWidth;
 for(let i=0;i<12;i++){
  detail.style.width=width+'px';
  const overhead=py+others.reduce((sum,el)=>sum+el.getBoundingClientRect().height,0)+gap*others.length;
  const height=Math.max(1,Math.min((maxWidth-px)/ratio,maxHeight-overhead));
  const next=Math.max(minWidth,Math.min(maxWidth,height*ratio+px));
  detail.style.setProperty('--popup-image-height',height+'px');
  if(Math.abs(next-width)<0.5)break;
  width=next;
 }
 detail.style.width=width+'px';
}
function preparePopupPhoto(){
 const img=document.querySelector('#detail .photo img');
 if(!img)return;
 img.loading='eager';
 img.addEventListener('load',fitPopupToPhoto,{once:true});
 if(img.complete)fitPopupToPhoto();
 requestAnimationFrame(fitPopupToPhoto);
}
window.addEventListener('resize',fitPopupToPhoto);

function selectObject(o,goMap=false){selectedIndex=objects.indexOf(o);const detail=document.getElementById('detail');detail.classList.add('open');detail.classList.remove('expanded');detail.innerHTML='<button class="popup-side popup-side-prev" aria-label="이전 물건" onclick="stepObject(-1)">←</button><button class="popup-side popup-side-next" aria-label="다음 물건" onclick="stepObject(1)">→</button><div class="popup-actions"><button class="popup-expand" aria-label="팝업 크게 보기" title="크게 보기" onclick="togglePopupSize()">⤢</button><button class="detail-close" aria-label="닫기" onclick="closeDetail()">×</button></div>'+photo(o)+'<div class="popup-title-row"><span class="popup-title">'+escapeHtml(o.title)+'</span></div><div class="popup-info"><div>'+escapeHtml(o.location)+'</div><div>'+escapeHtml(o.date)+' '+escapeHtml(o.time||'시간 미기록')+'</div></div>';preparePopupPhoto();d3.selectAll('.map-pin').classed('selected',function(){return this.dataset.id===o.id});if(goMap){location.hash='map';setTimeout(()=>{focusObject(o);fitPopupToPhoto()},90)}else focusObject(o)}
function togglePopupSize(){const el=document.getElementById('detail');const expanded=el.classList.toggle('expanded');el.querySelector('.popup-expand').textContent=expanded?'⤡':'⤢';el.querySelector('.popup-expand').setAttribute('aria-label',expanded?'중앙 확대 닫기':'이미지 중앙 확대');fitPopupToPhoto()}
function stepObject(direction){if(selectedIndex<0)return;selectObject(objects[(selectedIndex+direction+objects.length)%objects.length])}
function closeDetail(){document.getElementById('detail').classList.remove('open','expanded');selectedIndex=-1;d3.selectAll('.map-pin').classed('selected',false)}
function resetMap(){svg.transition().duration(850).call(zoomBehavior.transform,d3.zoomIdentity)}
function initMap(){projection=d3.geoNaturalEarth1().fitExtent([[45,45],[mapWidth-45,mapHeight-45]],{type:'Sphere'});const path=d3.geoPath(projection);svg=d3.select('#map').append('svg').attr('class','map-svg').attr('viewBox','0 0 '+mapWidth+' '+mapHeight).attr('role','img').attr('aria-label','검은색 대륙 실루엣 위에 발견 장소를 숫자로 표시한 세계지도');viewport=svg.append('g');zoomBehavior=d3.zoom().scaleExtent([1,9]).on('zoom',e=>{viewport.attr('transform',e.transform);viewport.selectAll('.map-pin').attr('transform',d=>{const p=projection([d.lng,d.lat]);return 'translate('+p[0]+','+p[1]+') scale('+(1/e.transform.k)+')'})});svg.call(zoomBehavior);svg.on('dblclick.zoom',null);
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json').then(topology=>{const land=topojson.feature(topology,topology.objects.land);viewport.insert('path',':first-child').datum(land).attr('class','map-land').attr('d',path)}).catch(err=>{console.error(err);document.getElementById('map').insertAdjacentHTML('beforeend','<div style="position:absolute;top:50px;left:18px;background:#fff;padding:10px;font-size:12px">지도 데이터를 불러오지 못했습니다.</div>')});
viewport.selectAll('.map-pin').data(objects.filter(o=>Number.isFinite(o.lat)&&Number.isFinite(o.lng))).enter().append('g').attr('class','map-pin').attr('data-id',d=>d.id).attr('transform',d=>{const p=projection([d.lng,d.lat]);return 'translate('+p[0]+','+p[1]+')'}).on('click',(event,d)=>{event.stopPropagation();selectObject(d)}).each(function(d){d3.select(this).append('circle').attr('r',16);d3.select(this).append('text').text(Number(d.id))});
document.getElementById('map').insertAdjacentHTML('beforeend','<div class="map-credit"></div><div class="map-controls"><button onclick="zoomBy(1.5)" aria-label="확대">+</button><button onclick="zoomBy(0.667)" aria-label="축소">−</button><button onclick="resetMap()" aria-label="전체 지도">⌂</button></div>')}
function zoomBy(factor){svg.transition().duration(400).call(zoomBehavior.scaleBy,factor)}
function renderTimeline(){const ordered=[...objects].sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('timeline').innerHTML='<div class="timeline-intro">FOUND OBJECTS / CHRONOLOGICAL RECORD · SCROLL →</div><div class="timeline-track">'+ordered.map((o,i)=>'<button class="timeline-entry" data-id="'+escapeHtml(o.id)+'" style="--photo-height:'+(175+(i%4)*23)+'px"><span class="tl-number">FIG. '+String(i+1).padStart(2,'0')+'</span><div class="tl-figure">'+photo(o)+'</div><div class="tl-date">'+escapeHtml(o.date)+'</div><div class="tl-stem"></div><div class="tl-dot"></div><div class="tl-caption">'+escapeHtml(o.title)+'<small>'+escapeHtml(o.location)+'<br>'+escapeHtml(o.note)+'</small></div></button>').join('')+'</div>';document.querySelectorAll('.timeline-entry').forEach(el=>el.addEventListener('click',()=>selectObject(objects.find(o=>o.id===el.dataset.id),true)))}
function route(){const page=location.hash==='#timeline'?'timeline':'map';document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page+'-page'));document.querySelectorAll('nav a').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);if(el.dataset.page===page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(page==='map'&&svg)svg.attr('viewBox','0 0 '+mapWidth+' '+mapHeight)}
async function startArchive(){try{const response=await fetch('./data/objects.json');if(!response.ok)throw new Error('HTTP '+response.status);objects=await response.json();renderTimeline();route();initMap();window.addEventListener('hashchange',route)}catch(error){console.error(error);document.getElementById('map').textContent='기록을 불러오지 못했습니다. 새로고침해 주세요.';route()}}startArchive();
</script></body></html>
