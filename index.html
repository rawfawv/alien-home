<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Things Out of Place — 제자리에 없는 것들</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--paper:#f7f6f0;--ink:#17252a;--muted:#718184;--mint:#d7e9e6;--line:#c9d3d0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'DM Mono','Noto Sans KR',sans-serif}button,a{font:inherit}header{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid var(--ink)}.brand{font-size:15px;font-weight:500;letter-spacing:-.06em}.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:4px}nav{display:flex;gap:9px}nav a{display:block;text-decoration:none;color:var(--ink);padding:10px 17px;border:1px solid var(--line);font-size:12px}nav a.active{background:var(--ink);color:white;border-color:var(--ink)}.page{display:none}.page.active{display:block}.heading{padding:34px 4vw 24px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.15em}.heading h1{font-size:clamp(36px,6vw,80px);font-weight:400;letter-spacing:-.085em;margin:8px 0 0;line-height:1}.heading p{font-size:11px;color:var(--muted);margin:0 0 5px}.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);min-height:calc(100vh - 210px)}#map{min-height:540px;background:#e8ebe5}.detail{border-left:1px solid var(--ink);padding:25px;display:flex;flex-direction:column;gap:20px}.detail-top{font-size:11px;display:flex;justify-content:space-between;color:var(--muted)}.photo{aspect-ratio:4/3;background:var(--mint);display:grid;place-items:center;border:1px solid var(--line);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo .placeholder{font-size:12px;color:var(--muted);text-align:center;line-height:2}.detail h2{font-size:26px;font-weight:400;letter-spacing:-.06em;margin:0}.detail p{font-size:12px;line-height:2;color:#526365;margin:0}.meta{margin-top:auto;border-top:1px solid var(--line);padding-top:15px;font-size:11px;line-height:2.2;color:var(--muted)}.leaflet-container{font-family:'DM Mono','Noto Sans KR',sans-serif}.object-pin{background:var(--ink);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--ink);width:16px;height:16px;border-radius:50%}.object-pin.selected{background:#83c5b8;transform:scale(1.35)}.timeline{border-top:1px solid var(--ink);padding:0 4vw 90px}.year{display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid var(--line);padding:35px 0}.year-label{font-size:28px;letter-spacing:-.07em}.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.entry{cursor:pointer;border:0;background:transparent;text-align:left;padding:0;color:inherit}.entry .photo{transition:filter .2s}.entry:hover .photo{filter:brightness(.94)}.entry-index{font-size:10px;color:var(--muted);margin:12px 0 8px}.entry-title{font-size:16px;letter-spacing:-.05em}.entry-location{font-size:10px;color:var(--muted);margin-top:7px}footer{display:flex;justify-content:space-between;padding:22px 4vw;font-size:10px;color:var(--muted)}@media(max-width:850px){.map-layout{grid-template-columns:1fr}#map{min-height:50vh}.detail{border-left:0;border-top:1px solid var(--ink)}.year{grid-template-columns:1fr;gap:22px}.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){header{padding:0 5vw}.brand{font-size:12px}.heading{padding:28px 5vw 22px}.heading p{display:none}nav a{padding:9px 11px}.timeline{padding:0 5vw 60px}.entries{gap:15px}.entry-title{font-size:13px}footer{padding:20px 5vw}}
</style></head><body>
<header><div class="brand">THINGS OUT OF PLACE<small>제자리에 없는 것들 · AN ARCHIVE OF FOUND OBJECTS</small></div><nav><a href="#map" data-page="map">MAP</a><a href="#timeline" data-page="timeline">TIMELINE</a></nav></header>
<main><section id="map-page" class="page"><div class="heading"><div><div class="eyebrow">01 / SPATIAL ARCHIVE</div><h1>Map<span style="color:#86aaa4">.</span></h1></div><p>OBJECTS FOUND IN UNEXPECTED PLACES</p></div><div class="map-layout"><div id="map" aria-label="발견된 사물의 위치 지도"></div><aside class="detail" id="detail"></aside></div></section>
<section id="timeline-page" class="page"><div class="heading"><div><div class="eyebrow">02 / CHRONOLOGICAL ARCHIVE</div><h1>Timeline<span style="color:#86aaa4">.</span></h1></div><p>TRACES COLLECTED OVER TIME</p></div><div class="timeline" id="timeline"></div></section></main>
<footer><span>THINGS OUT OF PLACE © 2026</span><span>AN ONGOING ARCHIVE</span></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
// 실제 기록으로 교체할 데이터. image에 사진 URL을 넣으면 두 화면에 동시에 표시됩니다.
// 좌표와 연도는 시연용 예시이며 실제 발견 위치/시점이 아닙니다.
const objects=[
{id:"001",title:"기둥 위의 장갑",date:"2024-11-18",location:"서울 · 위치 예시",lat:37.5665,lng:126.9780,image:"",note:"누군가 잃어버린 장갑을 다른 누군가가 눈에 잘 띄는 곳에 올려놓았을지도 모른다."},
{id:"002",title:"벤치 아래의 신발",date:"2023-06-04",location:"서울 · 위치 예시",lat:37.5480,lng:127.0410,image:"",note:"가지런히 놓인 신발. 이곳에 두고 간 사람의 사정은 알 수 없다."},
{id:"003",title:"식물에 걸린 장신구",date:"2022-09-21",location:"서울 · 위치 예시",lat:37.5770,lng:126.9860,image:"",note:"본래의 자리를 벗어나 다른 풍경의 일부가 된 물건."}
];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photo=o=>'<div class="photo">'+(o.image?'<img src="'+escapeHtml(o.image)+'" alt="'+escapeHtml(o.title)+'" loading="lazy">':'<div class="placeholder">IMAGE PENDING<br>사진을 추가할 수 있습니다</div>')+'</div>';
let map,markers=[];
function selectObject(o,goMap=false){document.getElementById('detail').innerHTML='<div class="detail-top"><span>FOUND OBJECT / '+escapeHtml(o.id)+'</span><span>'+escapeHtml(o.date)+'</span></div>'+photo(o)+'<h2>'+escapeHtml(o.title)+'</h2><p>'+escapeHtml(o.note)+'</p><div class="meta">LOCATION — '+escapeHtml(o.location)+'<br>COORDINATES — '+o.lat.toFixed(4)+', '+o.lng.toFixed(4)+'</div>';markers.forEach(m=>m.el.classList.toggle('selected',m.id===o.id));if(goMap){location.hash='map';setTimeout(()=>{map.invalidateSize();map.setView([o.lat,o.lng],14)},80)}}
function initMap(){map=L.map('map',{zoomControl:false}).setView([37.565,126.995],12);L.control.zoom({position:'bottomleft'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);objects.forEach(o=>{const icon=L.divIcon({className:'',html:'<div class="object-pin" id="pin-'+o.id+'"></div>',iconSize:[20,20],iconAnchor:[10,10]});const marker=L.marker([o.lat,o.lng],{icon}).addTo(map).on('click',()=>selectObject(o));markers.push({id:o.id,el:marker.getElement().querySelector('.object-pin')})});selectObject(objects[0])}
function renderTimeline(){const groups=Object.groupBy?Object.groupBy(objects,o=>o.date.slice(0,4)):objects.reduce((a,o)=>((a[o.date.slice(0,4)]??=[]).push(o),a),{});document.getElementById('timeline').innerHTML=Object.keys(groups).sort((a,b)=>b-a).map(y=>'<div class="year"><div class="year-label">'+y+'</div><div class="entries">'+groups[y].map(o=>'<button class="entry" data-id="'+o.id+'">'+photo(o)+'<div class="entry-index">NO. '+o.id+' / '+o.date+'</div><div class="entry-title">'+escapeHtml(o.title)+'</div><div class="entry-location">'+escapeHtml(o.location)+'</div></button>').join('')+'</div></div>').join('');document.querySelectorAll('.entry').forEach(el=>el.addEventListener('click',()=>selectObject(objects.find(o=>o.id===el.dataset.id),true)))}
function route(){const page=location.hash==='#timeline'?'timeline':'map';document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page+'-page'));document.querySelectorAll('nav a').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);if(el.dataset.page===page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(page==='map'&&map)setTimeout(()=>map.invalidateSize(),60)}
renderTimeline();route();initMap();window.addEventListener('hashchange',route);
</script></body></html>
