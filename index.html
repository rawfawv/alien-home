<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Things Out of Place — 제자리에 없는 것들</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--paper:#f7f6f0;--ink:#17252a;--muted:#718184;--mint:#d7e9e6;--line:#c9d3d0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'DM Mono','Noto Sans KR',sans-serif}button,a{font:inherit}header{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid var(--ink)}.brand{color:inherit;text-decoration:none;font-size:15px;font-weight:500;letter-spacing:-.06em}.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:4px}nav{display:flex;gap:9px}nav a{display:block;text-decoration:none;color:var(--ink);padding:10px 17px;border:1px solid var(--line);font-size:12px}nav a.active{background:var(--ink);color:white;border-color:var(--ink)}.page{display:none}.page.active{display:block}.heading{padding:34px 4vw 24px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.15em}.heading h1{font-size:clamp(36px,6vw,80px);font-weight:400;letter-spacing:-.085em;margin:8px 0 0;line-height:1}.heading p{font-size:11px;color:var(--muted);margin:0 0 5px}.map-layout{position:relative;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);height:calc(100vh - 210px);min-height:560px;overflow:hidden}#map{height:100%;width:100%;background:#e87983;position:relative}.detail{position:absolute;right:24px;bottom:24px;width:min(340px,calc(100% - 48px));max-height:calc(100% - 48px);overflow:auto;z-index:850;background:var(--paper);border:1px solid var(--ink);padding:20px;display:none;flex-direction:column;gap:14px;box-shadow:8px 8px 0 rgba(23,37,42,.16)}.detail.open{display:flex}.detail-close{position:absolute;top:14px;right:14px;border:0;background:transparent;cursor:pointer;font-size:22px;color:var(--ink)}.detail-top{font-size:11px;display:flex;justify-content:space-between;color:var(--muted)}.photo{aspect-ratio:4/3;background:var(--mint);display:grid;place-items:center;border:1px solid var(--line);overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo .placeholder{font-size:12px;color:var(--muted);text-align:center;line-height:2}.detail h2{font-size:26px;font-weight:400;letter-spacing:-.06em;margin:0}.detail p{font-size:12px;line-height:2;color:#526365;margin:0}.meta{margin-top:auto;border-top:1px solid var(--line);padding-top:15px;font-size:11px;line-height:2.2;color:var(--muted)}.leaflet-container{font-family:'DM Mono','Noto Sans KR',sans-serif}.object-pin{width:31px;height:31px;background:#f8f5eb;border:2px solid #15191b;color:#15191b;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:500;box-shadow:2px 2px 0 #15191b;transition:transform .2s}.object-pin.selected{background:#b7e5d8;transform:scale(1.18)}.map-svg{width:100%;height:100%;display:block;touch-action:none}.map-land{fill:#101112;stroke:none}.map-pin{cursor:pointer}.map-pin circle{fill:#f8f5eb;stroke:#101112;stroke-width:1.8;vector-effect:non-scaling-stroke}.map-pin text{font-size:11px;fill:#101112;text-anchor:middle;dominant-baseline:central;pointer-events:none}.map-pin.selected circle{fill:#a7e2d4}.map-controls{position:absolute;left:18px;bottom:18px;z-index:2;display:flex;gap:5px}.map-controls button{background:#f8f5eb;border:1px solid #101112;width:34px;height:34px;cursor:pointer;font-size:19px}.map-credit{position:absolute;left:18px;top:18px;font-size:10px;letter-spacing:.1em;color:#161616}.popup-nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}.popup-nav button{border:1px solid var(--ink);background:transparent;cursor:pointer;width:38px;height:32px;font-size:20px}.popup-nav span{font-size:11px;color:var(--muted)}.timeline{border-top:1px solid var(--ink);padding:0 4vw 90px}.year{display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid var(--line);padding:35px 0}.year-label{font-size:28px;letter-spacing:-.07em}.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.entry{cursor:pointer;border:0;background:transparent;text-align:left;padding:0;color:inherit}.entry .photo{transition:filter .2s}.entry:hover .photo{filter:brightness(.94)}.entry-index{font-size:10px;color:var(--muted);margin:12px 0 8px}.entry-title{font-size:16px;letter-spacing:-.05em}.entry-location{font-size:10px;color:var(--muted);margin-top:7px}footer{display:flex;justify-content:space-between;padding:22px 4vw;font-size:10px;color:var(--muted)}@media(max-width:850px){.map-layout{height:calc(100dvh - 180px);min-height:540px}.detail{right:12px;bottom:12px;width:min(310px,calc(100% - 24px))}.year{grid-template-columns:1fr;gap:22px}.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){header{padding:0 5vw}.brand{font-size:12px}.heading{padding:28px 5vw 22px}.heading p{display:none}nav a{padding:9px 11px}.timeline{padding:0 5vw 60px}.entries{gap:15px}.entry-title{font-size:13px}footer{padding:20px 5vw}}
</style></head><body>
<header><a class="brand" href="./" aria-label="홈 - 지도">THINGS OUT OF PLACE<small>제자리에 없는 것들 · AN ARCHIVE OF FOUND OBJECTS</small></a><nav><a href="./" data-page="map">MAP</a><a href="#timeline" data-page="timeline">TIMELINE</a></nav></header>
<main><section id="map-page" class="page"><div class="heading"><div><div class="eyebrow">01 / SPATIAL ARCHIVE</div><h1>Map<span style="color:#86aaa4">.</span></h1></div><p>OBJECTS FOUND IN UNEXPECTED PLACES</p></div><div class="map-layout"><div id="map" aria-label="발견된 사물의 위치 지도"></div><aside class="detail" id="detail"></aside></div></section>
<section id="timeline-page" class="page"><div class="heading"><div><div class="eyebrow">02 / CHRONOLOGICAL ARCHIVE</div><h1>Timeline<span style="color:#86aaa4">.</span></h1></div><p>TRACES COLLECTED OVER TIME</p></div><div class="timeline" id="timeline"></div></section></main>
<footer><span>THINGS OUT OF PLACE © 2026</span><span>AN ONGOING ARCHIVE</span></footer>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script>
// 실제 기록으로 교체할 데이터. image에 사진 URL을 넣으면 두 화면에 동시에 표시됩니다.
// 좌표와 연도는 시연용 예시이며 실제 발견 위치/시점이 아닙니다.
const objects=[
{id:"001",title:"기둥 위의 장갑",date:"2024-11-18",time:"시간 미기록",location:"서울 · 위치 예시",lat:37.5665,lng:126.9780,image:"",note:"누군가 잃어버린 장갑을 다른 누군가가 눈에 잘 띄는 곳에 올려놓았을지도 모른다."},
{id:"002",title:"벤치 아래의 신발",date:"2023-06-04",time:"시간 미기록",location:"서울 · 위치 예시",lat:37.5480,lng:127.0410,image:"",note:"가지런히 놓인 신발. 이곳에 두고 간 사람의 사정은 알 수 없다."},
{id:"003",title:"식물에 걸린 장신구",date:"2022-09-21",time:"시간 미기록",location:"서울 · 위치 예시",lat:37.5770,lng:126.9860,image:"",note:"본래의 자리를 벗어나 다른 풍경의 일부가 된 물건."}
];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photo=o=>'<div class="photo">'+(o.image?'<img src="'+escapeHtml(o.image)+'" alt="'+escapeHtml(o.title)+'" loading="lazy">':'<div class="placeholder">IMAGE PENDING<br>사진을 추가할 수 있습니다</div>')+'</div>';
let svg,projection,zoomBehavior,viewport,selectedIndex=-1;
const mapWidth=1200,mapHeight=620;
function focusObject(o,animate=true){const point=projection([o.lng,o.lat]);if(!point)return;const scale=3.1;const x=mapWidth*.47-point[0]*scale,y=mapHeight*.48-point[1]*scale;const transform=d3.zoomIdentity.translate(x,y).scale(scale);const target=animate?svg.transition().duration(950):svg;target.call(zoomBehavior.transform,transform)}
function selectObject(o,goMap=false){selectedIndex=objects.indexOf(o);const detail=document.getElementById('detail');detail.classList.add('open');detail.innerHTML='<button class="detail-close" aria-label="닫기" onclick="closeDetail()">×</button><div class="detail-top"><span>FOUND OBJECT / '+escapeHtml(o.id)+'</span></div>'+photo(o)+'<h2>'+escapeHtml(o.title)+'</h2><p>'+escapeHtml(o.note)+'</p><div class="meta">ADDRESS — '+escapeHtml(o.location)+'<br>FOUND — '+escapeHtml(o.date)+' / '+escapeHtml(o.time||'시간 미기록')+'<br>COORDINATES — '+o.lat.toFixed(4)+', '+o.lng.toFixed(4)+'</div><div class="popup-nav"><button aria-label="이전 물건" onclick="stepObject(-1)">←</button><span>'+String(selectedIndex+1).padStart(2,'0')+' / '+String(objects.length).padStart(2,'0')+'</span><button aria-label="다음 물건" onclick="stepObject(1)">→</button></div>';d3.selectAll('.map-pin').classed('selected',function(){return this.dataset.id===o.id});if(goMap){location.hash='map';setTimeout(()=>focusObject(o),90)}else focusObject(o)}
function stepObject(direction){if(selectedIndex<0)return;selectObject(objects[(selectedIndex+direction+objects.length)%objects.length])}
function closeDetail(){document.getElementById('detail').classList.remove('open');selectedIndex=-1;d3.selectAll('.map-pin').classed('selected',false)}
function resetMap(){svg.transition().duration(850).call(zoomBehavior.transform,d3.zoomIdentity)}
function initMap(){projection=d3.geoNaturalEarth1().fitExtent([[45,45],[mapWidth-45,mapHeight-45]],{type:'Sphere'});const path=d3.geoPath(projection);svg=d3.select('#map').append('svg').attr('class','map-svg').attr('viewBox','0 0 '+mapWidth+' '+mapHeight).attr('role','img').attr('aria-label','검은색 대륙 실루엣 위에 발견 장소를 숫자로 표시한 세계지도');viewport=svg.append('g');zoomBehavior=d3.zoom().scaleExtent([1,9]).on('zoom',e=>{viewport.attr('transform',e.transform);viewport.selectAll('.map-pin').attr('transform',d=>{const p=projection([d.lng,d.lat]);return 'translate('+p[0]+','+p[1]+') scale('+(1/e.transform.k)+')'})});svg.call(zoomBehavior);svg.on('dblclick.zoom',null);
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json').then(topology=>{const land=topojson.feature(topology,topology.objects.land);viewport.insert('path',':first-child').datum(land).attr('class','map-land').attr('d',path)}).catch(err=>{console.error(err);document.getElementById('map').insertAdjacentHTML('beforeend','<div style="position:absolute;top:50px;left:18px;background:#fff;padding:10px;font-size:12px">지도 데이터를 불러오지 못했습니다.</div>')});
viewport.selectAll('.map-pin').data(objects).enter().append('g').attr('class','map-pin').attr('data-id',d=>d.id).attr('transform',d=>{const p=projection([d.lng,d.lat]);return 'translate('+p[0]+','+p[1]+')'}).on('click',(event,d)=>{event.stopPropagation();selectObject(d)}).each(function(d){d3.select(this).append('circle').attr('r',16);d3.select(this).append('text').text(Number(d.id))});
document.getElementById('map').insertAdjacentHTML('beforeend','<div class="map-credit">WORLD / FOUND OBJECTS</div><div class="map-controls"><button onclick="zoomBy(1.5)" aria-label="확대">+</button><button onclick="zoomBy(0.667)" aria-label="축소">−</button><button onclick="resetMap()" aria-label="전체 지도">⌂</button></div>')}
function zoomBy(factor){svg.transition().duration(400).call(zoomBehavior.scaleBy,factor)}
function renderTimeline(){const groups=Object.groupBy?Object.groupBy(objects,o=>o.date.slice(0,4)):objects.reduce((a,o)=>((a[o.date.slice(0,4)]??=[]).push(o),a),{});document.getElementById('timeline').innerHTML=Object.keys(groups).sort((a,b)=>b-a).map(y=>'<div class="year"><div class="year-label">'+y+'</div><div class="entries">'+groups[y].map(o=>'<button class="entry" data-id="'+o.id+'">'+photo(o)+'<div class="entry-index">NO. '+o.id+' / '+o.date+'</div><div class="entry-title">'+escapeHtml(o.title)+'</div><div class="entry-location">'+escapeHtml(o.location)+'</div></button>').join('')+'</div></div>').join('');document.querySelectorAll('.entry').forEach(el=>el.addEventListener('click',()=>selectObject(objects.find(o=>o.id===el.dataset.id),true)))}
function route(){const page=location.hash==='#timeline'?'timeline':'map';document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page+'-page'));document.querySelectorAll('nav a').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);if(el.dataset.page===page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(page==='map'&&svg)svg.attr('viewBox','0 0 '+mapWidth+' '+mapHeight)}
renderTimeline();route();initMap();window.addEventListener('hashchange',route);
</script></body></html>
