<main><section id="map-page" class="page"><div class="map-layout"><div id="map" aria-label="발견된 사물의 위치 지도"></div><aside class="detail" id="detail"></aside></div></section>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script>
// 실제 기록으로 교체할 데이터. image에 사진 URL을 넣으면 두 화면에 동시에 표시됩니다.
// 좌표와 연도는 시연용 예시이며 실제 발견 위치/시점이 아닙니다.
let objects=[];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photo=o=>'<div class="photo">'+(o.image?'<img src="'+escapeHtml(o.image)+'" alt="'+escapeHtml(o.title)+'" loading="lazy">':'<div class="placeholder">IMAGE PENDING<br>사진을 추가할 수 있습니다</div>')+'</div>';

const mapWidth=1200,mapHeight=620;
function focusObject(o,animate=true){if(!Number.isFinite(o.lat)||!Number.isFinite(o.lng))return;const point=projection([o.lng,o.lat]);if(!point)return;const scale=3.1;const x=mapWidth*.47-point[0]*scale,y=mapHeight*.48-point[1]*scale;const transform=d3.zoomIdentity.translate(x,y).scale(scale);const target=animate?svg.transition().duration(950):svg;target.call(zoomBehavior.transform,transform)}

function fitPopupToPhoto(){
 const detail=document.getElementById('detail'),img=detail.querySelector('.photo img');
 if(!detail.classList.contains('open')||!img||!img.naturalWidth)return;
 const expanded=detail.classList.contains('expanded'),mobile=window.innerWidth<=520;
 const style=getComputedStyle(detail),px=parseFloat(style.paddingLeft)+parseFloat(style.paddingRight),py=parseFloat(style.paddingTop)+parseFloat(style.paddingBottom),gap=parseFloat(style.rowGap)||0;
 const layout=document.querySelector('.map-layout');
 const maxWidth=expanded?Math.min(900,window.innerWidth-(mobile?24:48)):Math.min(620,layout.clientWidth-(mobile?16:32));
 if(!expanded)detail.style.bottom=Math.max(mobile?8:16,layout.clientHeight-(window.innerHeight-layout.getBoundingClientRect().top)+(mobile?8:16))+'px';
 const maxHeight=expanded?window.innerHeight-48:Math.min(layout.clientHeight,window.innerHeight-layout.getBoundingClientRect().top)-(mobile?16:32);
 const ratio=img.naturalWidth/img.naturalHeight,others=[...detail.children].filter(el=>!el.classList.contains('photo')&&!el.classList.contains('popup-side'));
 const minWidth=Math.min(maxWidth,200+px);
 let width=maxWidth;
 for(let i=0;i<12;i++){
  detail.style.width=width+'px';
  const overhead=py+others.reduce((sum,el)=>sum+el.getBoundingClientRect().height,0)+gap*others.length;
  const height=Math.max(1,Math.min((maxWidth-px)/ratio,maxHeight-overhead));
  const next=Math.max(minWidth,Math.min(maxWidth,height*ratio+px));
  detail.style.setProperty('--popup-image-height',height+'px');
  if(Math.abs(next-width)<0.5)break;
  width=next;
 }
 detail.style.width=width+'px';
}
function preparePopupPhoto(){
 const img=document.querySelector('#detail .photo img');
 if(!img)return;
 img.loading='eager';
 img.addEventListener('load',fitPopupToPhoto,{once:true});
 if(img.complete)fitPopupToPhoto();
 requestAnimationFrame(fitPopupToPhoto);
}
window.addEventListener('resize',fitPopupToPhoto);

function selectObject(o,goMap=false){selectedIndex=objects.indexOf(o);const detail=document.getElementById('detail');detail.classList.add('open');detail.classList.remove('expanded');detail.innerHTML='<button class="popup-side popup-side-prev" aria-label="이전 물건" onclick="stepObject(-1)">←</button><button class="popup-side popup-side-next" aria-label="다음 물건" onclick="stepObject(1)">→</button><div class="popup-actions"><button class="popup-expand" aria-label="팝업 크게 보기" title="크게 보기" onclick="togglePopupSize()">⤢</button><button class="detail-close" aria-label="닫기" onclick="closeDetail()">×</button></div>'+photo(o)+'<div class="popup-title-row"><span class="popup-title">'+escapeHtml(o.title)+'</span></div><div class="popup-info"><div>'+escapeHtml(o.location)+'</div><div>'+escapeHtml(o.date)+' '+escapeHtml(o.time||'시간 미기록')+'</div></div>';preparePopupPhoto();d3.selectAll('.map-pin').classed('selected',function(){return this.dataset.id===o.id});if(goMap){location.hash='map';setTimeout(()=>{focusObject(o);fitPopupToPhoto()},90)}else focusObject(o)}
function togglePopupSize(){const el=document.getElementById('detail');const expanded=el.classList.toggle('expanded');el.querySelector('.popup-expand').textContent=expanded?'⤡':'⤢';el.querySelector('.popup-expand').setAttribute('aria-label',expanded?'중앙 확대 닫기':'이미지 중앙 확대');fitPopupToPhoto()}
function stepObject(direction){if(selectedIndex<0)return;selectObject(objects[(selectedIndex+direction+objects.length)%objects.length])}
function closeDetail(){document.getElementById('detail').classList.remove('open','expanded');selectedIndex=-1;d3.selectAll('.map-pin').classed('selected',false)}
function resetMap(){svg.transition().duration(850).call(zoomBehavior.transform,d3.zoomIdentity)}
function initMap(){projection=d3.geoNaturalEarth1().fitExtent([[45,45],[mapWidth-45,mapHeight-45]],{type:'Sphere'});const path=d3.geoPath(projection);svg=d3.select('#map').append('svg').attr('class','map-svg').attr('viewBox','0 0 '+mapWidth+' '+mapHeight).attr('role','img').attr('aria-label','검은색 대륙 실루엣 위에 발견 장소를 숫자로 표시한 세계지도');viewport=svg.append('g');zoomBehavior=d3.zoom().scaleExtent([1,9]).on('zoom',e=>{viewport.attr('transform',e.transform);viewport.selectAll('.map-pin').attr('transform',d=>{const p=projection([d.lng,d.lat]);return 'translate('+p[0]+','+p[1]+') scale('+(1/e.transform.k)+')'})});svg.call(zoomBehavior);svg.on('dblclick.zoom',null);
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json').then(topology=>{const land=topojson.feature(topology,topology.objects.land);viewport.insert('path',':first-child').datum(land).attr('class','map-land').attr('d',path)}).catch(err=>{console.error(err);document.getElementById('map').insertAdjacentHTML('beforeend','<div style="position:absolute;top:50px;left:18px;background:#fff;padding:10px;font-size:12px">지도 데이터를 불러오지 못했습니다.</div>')});
viewport.selectAll('.map-pin').data(objects.filter(o=>Number.isFinite(o.lat)&&Number.isFinite(o.lng))).enter().append('g').attr('class','map-pin').attr('data-id',d=>d.id).attr('transform',d=>{const p=projection([d.lng,d.lat]);return 'translate('+p[0]+','+p[1]+')'}).on('click',(event,d)=>{event.stopPropagation();selectObject(d)}).each(function(d){d3.select(this).append('circle').attr('r',16);d3.select(this).append('text').text(Number(d.id))});
document.getElementById('map').insertAdjacentHTML('beforeend','<div class="map-credit"></div><div class="map-controls"><button onclick="zoomBy(1.5)" aria-label="확대">+</button><button onclick="zoomBy(0.667)" aria-label="축소">−</button><button onclick="resetMap()" aria-label="전체 지도">⌂</button></div>')}
function zoomBy(factor){svg.transition().duration(400).call(zoomBehavior.scaleBy,factor)}
let timelineZoom=1,timelineModel=null;
function buildTimelineModel(records){
 const dated=[],undated=[];
 for(const o of records){const stamp=/^\d{4}-\d{2}-\d{2}$/.test(o.date)?Date.parse(o.date+'T00:00:00Z'):NaN;(Number.isFinite(stamp)?dated:undated).push({...o,stamp})}
 dated.sort((a,b)=>a.stamp-b.stamp||a.id.localeCompare(b.id));
 const first=dated.length?new Date(dated[0].stamp).getUTCFullYear():new Date().getFullYear(),last=dated.length?new Date(dated[dated.length-1].stamp).getUTCFullYear():first;
 return {dated,undated,first,last,start:Date.UTC(first,0,1),end:Date.UTC(last+1,0,1)};
}
function layoutTimeline(model,width,zoom){
 const cardWidth=Math.min(120,zoom>=3?80+(zoom-3)*3:4+zoom*4),laneEnds=[];
 const items=model.dated.map(o=>{const x=24+(o.stamp-model.start)/(model.end-model.start)*(width-48);let lane=laneEnds.findIndex(end=>end<=x-cardWidth/2-4);if(lane<0)lane=laneEnds.length;laneEnds[lane]=x+cardWidth/2;return {o,x,lane}});
 return {items,cardWidth,lanes:Math.max(1,laneEnds.length)};
}
function renderTimeline(){
 timelineModel=buildTimelineModel(objects);
 document.getElementById('timeline').innerHTML='<div class="date-timeline-tools"><span class="date-timeline-label">'+timelineModel.first+' — '+timelineModel.last+' / '+objects.length+' RECORDS</span><div class="date-timeline-zoom"><button type="button" id="timeline-fit">전체 보기</button><button type="button" id="timeline-minus" aria-label="타임라인 축소">−</button><input id="timeline-scale" type="range" min="1" max="24" step="0.01" value="1" aria-label="타임라인 확대 배율"><button type="button" id="timeline-plus" aria-label="타임라인 확대">+</button><output id="timeline-scale-label">1×</output></div></div><div class="date-timeline-hint">날짜에 비례한 간격 · 확대해서 자세히 보기 · 좌우로 스크롤</div><div class="date-timeline-scroll" tabindex="0" aria-label="사진 타임라인, 확대 후 좌우로 스크롤"><div class="date-timeline-canvas"></div></div><div class="date-timeline-undated"></div>';
 document.getElementById('timeline-fit').onclick=()=>setTimelineZoom(1);
 document.getElementById('timeline-minus').onclick=()=>setTimelineZoom(timelineZoom/1.5);
 document.getElementById('timeline-plus').onclick=()=>setTimelineZoom(timelineZoom*1.5);
 document.getElementById('timeline-scale').oninput=e=>setTimelineZoom(Number(e.target.value));
 const undated=document.querySelector('.date-timeline-undated');
 if(timelineModel.undated.length){undated.innerHTML='<span>촬영일 미기록</span>'+timelineModel.undated.map(o=>'<button type="button" data-id="'+escapeHtml(o.id)+'">'+photo(o)+'<span>'+escapeHtml(o.title)+'</span></button>').join('');undated.querySelectorAll('button').forEach(el=>el.onclick=()=>selectObject(objects.find(o=>o.id===el.dataset.id),true))}
 drawTimeline();
}
function setTimelineZoom(value){
 const scroll=document.querySelector('.date-timeline-scroll');if(!scroll)return;
 const oldWidth=scroll.scrollWidth,anchor=(scroll.scrollLeft+scroll.clientWidth/2)/oldWidth;
 timelineZoom=Math.min(24,Math.max(1,value));
 document.getElementById('timeline-scale').value=timelineZoom;
 document.getElementById('timeline-scale-label').textContent=Number(timelineZoom.toFixed(1))+'×';
 document.getElementById('timeline-minus').disabled=timelineZoom===1;document.getElementById('timeline-plus').disabled=timelineZoom===24;
 drawTimeline();scroll.scrollLeft=timelineZoom===1?0:anchor*scroll.scrollWidth-scroll.clientWidth/2;
}
function drawTimeline(){
 const scroll=document.querySelector('.date-timeline-scroll');if(!scroll||!timelineModel||!scroll.clientWidth)return;
 const canvas=scroll.querySelector('.date-timeline-canvas'),width=scroll.clientWidth*timelineZoom;
 const layout=layoutTimeline(timelineModel,width,timelineZoom),detailed=timelineZoom>=3;
 const compactGap=timelineZoom===1?8:16;
 const figureHeight=timelineZoom===1?Math.max(100,Math.min(180,(Math.max(200,window.innerHeight-280)-76)/layout.lanes-compactGap)):Math.max(180,layout.cardWidth*3),laneHeight=figureHeight+(detailed?76:compactGap),height=76+layout.lanes*laneHeight;
 canvas.style.width=width+'px';canvas.style.height=height+'px';canvas.classList.toggle('is-detailed',detailed);
 const position=stamp=>24+(stamp-timelineModel.start)/(timelineModel.end-timelineModel.start)*(width-48);
 let ticks='';for(let year=timelineModel.first;year<=timelineModel.last;year++){
  const x=position(Date.UTC(year,0,1)),right=position(Date.UTC(year+1,0,1));
  ticks+='<div class="date-year-band" style="left:'+x+'px;width:'+(right-x)+'px"><span>'+year+'</span></div>';
  if(right-x>=280)for(let month=1;month<12;month++)ticks+='<div class="date-month-tick" style="left:'+position(Date.UTC(year,month,1))+'px"><span>'+(month+1)+'월</span></div>';
 }
 canvas.innerHTML=ticks+'<div class="date-timeline-axis"></div>'+layout.items.map(({o,x,lane})=>{const top=68+lane*laneHeight;return '<div class="date-photo-stem" style="left:'+x+'px;height:'+(top-44)+'px"></div><button type="button" class="date-photo" data-id="'+escapeHtml(o.id)+'" style="left:'+x+'px;top:'+top+'px;width:'+layout.cardWidth+'px;--date-photo-height:'+figureHeight+'px" title="'+escapeHtml(o.date+' · '+o.title+' · '+o.location)+'" aria-label="'+escapeHtml(o.date+' · '+o.title)+'">'+photo(o)+'<span class="date-photo-date">'+escapeHtml(o.date)+'</span><span class="date-photo-title">'+escapeHtml(o.title)+'</span></button>'}).join('');
 canvas.querySelectorAll('.date-photo').forEach(el=>el.onclick=()=>selectObject(objects.find(o=>o.id===el.dataset.id),true));
}
window.addEventListener('resize',()=>{if(location.hash==='#timeline')drawTimeline()});

function route(){const page=location.hash==='#timeline'?'timeline':'map';document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page+'-page'));document.querySelectorAll('nav a').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);if(el.dataset.page===page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(page==='timeline')requestAnimationFrame(drawTimeline);if(page==='map'&&svg)svg.attr('viewBox','0 0 '+mapWidth+' '+mapHeight)}
async function startArchive(){try{const response=await fetch('./data/objects.json');if(!response.ok)throw new Error('HTTP '+response.status);objects=await response.json();renderTimeline();route();initMap();window.addEventListener('hashchange',route)}catch(error){console.error(error);document.getElementById('map').textContent='기록을 불러오지 못했습니다. 새로고침해 주세요.';route()}}startArchive();
</script></body></html>
